<style>
/* ============ SHELL (shared by all 16 themes — keep minimal) ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:#0b0b10;color:#f5f2ea;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* concept switcher — always available, themes may recolor it via body[data-theme] */
.tabbar{position:sticky;top:0;z-index:200;background:#111;border-bottom:1px solid rgba(255,255,255,.14)}
.tabbar-inner{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:10px 14px;-webkit-overflow-scrolling:touch}
.tabbar-inner::-webkit-scrollbar{display:none}
.tabbar-label{flex:none;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  opacity:.55;margin-right:4px;color:#fff}
.tab{flex:none;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.6);border:1px solid transparent;border-radius:999px;padding:8px 14px;white-space:nowrap}
.tab.active{color:#0b0b10;background:#fff}
#stage{display:block;min-height:60dvh}

/* disclosure — always present, themes may recolor */
.disclosure{padding:18px 20px calc(20px + env(safe-area-inset-bottom));text-align:center;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;line-height:1.8}
.disclosure a{text-decoration:underline}

/* scroll reveal base — themes define their own motion via .rv/.rv.in */
.rv{opacity:0}
.rv.in{opacity:1}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1!important;transform:none!important}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ============ THEME CSS (built from work/batch*/themes.css) ============ */
/*__THEME_CSS__*/
</style>
</head>

/* star helper: 5 -> ★★★★★, 4.5 -> ★★★★½ */
var MFC = {
  stars: function(n){
    if (n == null) return "";
    var f = Math.floor(n), h = (n - f) >= 0.5 ? "\u00BD" : "";
    return "\u2605".repeat(f) + h;
  }
};

/* theme registry - filled by work/batchN/themes.js (see tools/build.py) */
var THEMES = {};
var THEME_ORDER = ["neon","zine","editorial","screenplay","brutalist","noir",
  "letterboxd","boxoffice","festival","videostore","groupchat","calendar",
  "marquee","stubs","booth","boarding",
  "terminal","passport","radio","menu","blueprint","mixtape","newspaper","arcade",
  "subway","polaroid","vhs","weather","stocks","fieldnotes","telegram","locker","drivein",
  "museum","airbnb","deck","wanted","playbill","departures","recipe","comic","answering",
  "scorecard","yearbook","classifieds","jukebox","treasuremap","phonebook","tradingcards","billboard"];

/*__THEME_JS__*/

/* ============ router ============ */
var stage = document.getElementById("stage");
var tabsEl = document.getElementById("tabs");
THEME_ORDER.forEach(function(key){
  var b = document.createElement("button");
  b.className = "tab"; b.dataset.theme = key;
  b.textContent = (THEMES[key] && THEMES[key].label) || key;
  b.addEventListener("click", function(){ setTheme(key); });
  tabsEl.appendChild(b);
});
function setTheme(key, save){
  if (!THEMES[key]) key = THEME_ORDER[0];
  document.body.setAttribute("data-theme", key);
  document.body.className = "";
  stage.innerHTML = THEMES[key].render(CONTENT);
  if (THEMES[key].mount) { try { THEMES[key].mount(stage); } catch(e){} }
  var tabs = tabsEl.querySelectorAll(".tab");
  tabs.forEach(function(b){ b.classList.toggle("active", b.dataset.theme === key); });
  var m = document.getElementById("tcolor");
  if (m && THEMES[key].meta) m.setAttribute("content", THEMES[key].meta);
  if (save !== false) { try { localStorage.setItem("mfc-theme", key); } catch(e){} }
  window.scrollTo(0, 0);
  requestAnimationFrame(revealScan);
}
/* scroll reveals */
var revealIO = null;
function revealScan(){
  var els = stage.querySelectorAll(".rv:not(.in)");
  if (!("IntersectionObserver" in window)) { els.forEach(function(el){ el.classList.add("in"); }); return; }
  if (!revealIO) {
    revealIO = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) { en.target.classList.add("in"); revealIO.unobserve(en.target); }
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -4% 0px" });
  }
  els.forEach(function(el){ revealIO.observe(el); });
}
(function init(){
  var key = THEME_ORDER[0];
  try {
    var saved = localStorage.getItem("mfc-theme");
    if (saved && THEMES[saved]) key = saved;
  } catch(e){}
  setTheme(key, false);
})();
