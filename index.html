<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06061f" id="tcolor">
<title>Miami Film Club — 16 Concepts</title>
<meta name="description" content="Sixteen concept redesigns for the Miami Film Club. Unofficial pitch mockup.">
<style>
/* ============ SHELL (shared by all 16 themes — keep minimal) ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:#0b0b10;color:#f5f2ea;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* concept switcher — always available, themes may recolor it via body[data-theme] */
.tabbar{position:sticky;top:0;z-index:200;background:#111;border-bottom:1px solid rgba(255,255,255,.14)}
.tabbar-inner{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:10px 14px;-webkit-overflow-scrolling:touch}
.tabbar-inner::-webkit-scrollbar{display:none}
.tabbar-label{flex:none;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  opacity:.55;margin-right:4px;color:#fff}
.tab{flex:none;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.6);border:1px solid transparent;border-radius:999px;padding:8px 14px;white-space:nowrap}
.tab.active{color:#0b0b10;background:#fff}
#stage{display:block;min-height:60dvh}

/* disclosure — always present, themes may recolor */
.disclosure{padding:18px 20px calc(20px + env(safe-area-inset-bottom));text-align:center;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;line-height:1.8}
.disclosure a{text-decoration:underline}

/* scroll reveal base — themes define their own motion via .rv/.rv.in */
.rv{opacity:0}
.rv.in{opacity:1}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1!important;transform:none!important}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ============ THEME CSS (built from work/batch*/themes.css) ============ */

/* ===== batch1 ===== */
/* MIAMI FILM CLUB — batch 1 concept themes CSS.
   EVERY selector is scoped under body[data-theme="<key>"]. No global rules. */

/* ================= NEON 305 ================= */

body[data-theme="neon"] .n305-snum { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; border:2px solid #ff2fb3; color:#ff9bd8; font-size:12px; font-weight:800; flex:none; }

@media (prefers-reduced-motion: reduce) { body[data-theme="neon"] * { animation:none !important; transition:none !important; } }

  radial-gradient(1.8px 1.8px at 44% 8%, rgba(255,255,255,.7), transparent 60%),
  radial-gradient(1.2px 1.2px at 63% 15%, rgba(255,255,255,.55), transparent 60%),
  radial-gradient(1.5px 1.5px at 81% 7%, rgba(255,255,255,.8), transparent 60%),
  radial-gradient(1.1px 1.1px at 93% 20%, rgba(255,255,255,.5), transparent 60%),
  radial-gradient(1.4px 1.4px at 15% 30%, rgba(255,255,255,.4), transparent 60%),
  radial-gradient(1.2px 1.2px at 55% 26%, rgba(255,255,255,.45), transparent 60%),
  radial-gradient(1.6px 1.6px at 74% 32%, rgba(255,255,255,.5), transparent 60%),

   Each render(c) returns a full HTML string for the theme root.

var THEMES = THEMES || {};

(function () {

  /* ============ 2. NOIR ============ */
  THEMES.noir = {

        }

    mount: function (root) {

      var prompts = { 1: "Which night are you in for?", 2: "How many tickets?", 3: "One tap and you're in." };

      function tileData(id) {
        var t = root.querySelector('[data-pick="' + id + '"]');
        return t ? t.dataset : null;
      }
      function summaryHTML(d) {
        return '<p class="kx-srow"><span>EVENT</span><strong>' + esc(d.title) + "</strong></p>"
          + '<p class="kx-srow"><span>DATE</span><strong>' + esc(d.when) + "</strong></p>"
          + (d.venue ? '<p class="kx-srow"><span>VENUE</span><strong>' + esc(d.venue) + "</strong></p>" : "")
          + (d.note ? '<p class="kx-srow"><span>NOTE</span><strong>' + esc(d.note) + "</strong></p>" : "")
          + '<p class="kx-srow"><span>TICKETS</span><strong data-qtyecho>' + sel.qty + "</strong></p>";
      }
      function show(n) {
        var secs = root.querySelectorAll(".kx-step");
        for (var i = 0; i < secs.length; i++) {
          var s = secs[i];
          var on = s.getAttribute("data-step") === String(n);
          s.hidden = !on;
          if (on) {
            s.classList.remove("kx-in");
            void s.offsetWidth;
            s.classList.add("kx-in");
            var rvs = s.querySelectorAll(".rv:not(.in)");
            for (var m = 0; m < rvs.length; m++) rvs[m].classList.add("in");
          }
        }
        for (var j = 0; j < steps.length; j++) {
          var li = steps[j];
          var sn = parseInt(li.getAttribute("data-s"), 10);
          li.classList.toggle("on", sn === n);
          li.classList.toggle("done", sn < n);
        }
        if (q) q.textContent = prompts[n];
        if (stage && n !== 1) stage.scrollIntoView({ block: "start", behavior: "smooth" });
      }
      function refreshQty() {
        var v = root.querySelector("[data-qtyv]");
        if (v) v.textContent = sel.qty;
        var e1 = root.querySelector('[data-sum2] [data-qtyecho]');
        var e2 = root.querySelector('[data-sum3] [data-qtyecho]');
        if (e1) e1.textContent = sel.qty;
        if (e2) e2.textContent = sel.qty;
      }
      root.addEventListener("click", function (ev) {
        var pick = ev.target.closest("[data-pick]");
        if (pick) {
          sel.id = pick.getAttribute("data-pick");
          sel.qty = 2;
          var d = tileData(sel.id);
          if (!d) return;
          var s2 = root.querySelector("[data-sum2]");
          var s3 = root.querySelector("[data-sum3]");
          if (s2) s2.innerHTML = summaryHTML(d);
          if (s3) s3.innerHTML = summaryHTML(d);
          var book = root.querySelector("[data-book]");
          if (book) {
            book.href = d.ticketurl;
            book.textContent = d.ticketlabel.toUpperCase() + " \u2192";
          }
          var sy = root.querySelector("[data-seeyou]");
          if (sy) sy.textContent = d.venue ? "See you at " + d.venue + "." : "See you there.";
          var cf = root.querySelector("[data-confirm]");
          if (cf) cf.hidden = true;
          refreshQty();
          show(2);
          return;
        }
        var qb = ev.target.closest("[data-qty]");
        if (qb) {
          sel.qty = Math.min(10, Math.max(1, sel.qty + parseInt(qb.getAttribute("data-qty"), 10)));
          refreshQty();
          return;
        }
        var nx = ev.target.closest("[data-next]");
        if (nx) { show(parseInt(nx.getAttribute("data-next"), 10)); return; }
        var bk = ev.target.closest("[data-back]");
        if (bk) { show(parseInt(bk.getAttribute("data-back"), 10)); return; }
        var book2 = ev.target.closest("[data-book]");
        if (book2) {
          var cf2 = root.querySelector("[data-confirm]");
          if (cf2) {
            cf2.hidden = false;
            var rvs = cf2.querySelectorAll(".rv:not(.in)");
            for (var k = 0; k < rvs.length; k++) rvs[k].classList.add("in");
          }
        }
      });
      show(1);
    }
  };
})();

  return (window.MFC && MFC.stars) ? MFC.stars(n) : "";

  return '<a class="rv" href="' + url + '" target="_blank" rel="noopener">' + label + "</a>";

function _ticket(ev, cls){
  return '<a class="' + (cls || "ticket") + '" href="' + ev.ticketUrl + '" target="_blank" rel="noopener">' + ev.ticketLabel + "</a>";

/* =====================================================================
   3) GROUPCHAT — "The club's iMessage thread"
   No sections, no headers, no page: a phone thread of bubbles.
   Events = message bubbles, RSVP poll bubble, diary = photo bubbles,
   reviews = forwarded links, bottom input = join CTA. Pop-in stagger.
   ===================================================================== */
THEMES.groupchat = {
  label: "Group Chat",
  meta: "#f2f2f7",
  render: function(c){
    function bubble(html, cls, who){
      return '<div class="msgrow ' + (cls || "") + '">' +
        (who ? '<div class="mavatar" aria-hidden="true">' + who.charAt(0) + "</div>" : '<div class="mavatar mavatar-spacer" aria-hidden="true"></div>') +
        '<div class="bubble rv">' + html + "</div></div>";
    }
    function stamp(t, read){
      return '<div class="stamp rv"><span>' + t + "</span>" + (read ? '<span class="read">Read</span>' : "") + "</div>";
    }
    var who = c.member.name;
    var out = "";

    out += stamp("Tue, 8:42 AM", true);
    out += bubble(
      "<p><strong>3 things this month you're NOT allowed to miss:</strong></p>",
      "them", who);

    /* Holmes contest = text + rich link bubble with RSVP button */
    out += bubble(
      '<p class="mname">' + who + "</p>" +
      '<p><strong>' + c.events[0].title + "</strong><br>" +
      c.events[0].dow + " " + c.events[0].mon + " " + c.events[0].day + " · " + c.events[0].time + " · " + c.events[0].venue + "</p>" +
      '<a class="richlink" href="' + c.events[0].ticketUrl + '" target="_blank" rel="noopener">' +
        '<span class="richdomain">instagram.com</span><span class="richtitle">' + c.events[0].title + "</span></a>" +
      '<p>' + _ticket(c.events[0], "ticket imsg") + "</p>",
      "them", who);
    out += stamp("8:43 AM", true);

    /* Rocky Horror = "who's in??" + tapbacks */
    out += bubble(
      "<p>ok " + c.events[1].title + " at " + c.events[1].venue + " on " + c.events[1].dow + " " + c.events[1].mon + " " + c.events[1].day +
      (c.events[1].note ? " (" + c.events[1].note.toLowerCase() + ")" : "") + "</p><p><strong>who's in??</strong></p>" +
      '<div class="tapbacks" aria-hidden="true"><span class="tap">loved by 24</span><span class="tap">liked by 31</span></div>' +
      '<p>' + _ticket(c.events[1], "ticket imsg") + "</p>",
      "them", who);

    /* Oktoberfest = forwarded perk */
    out += bubble(
      '<p class="fwd">Forwarded</p>' +
      '<p><strong>' + c.events[2].title + "</strong><br>" + c.events[2].note + "</p>" +
      '<p>' + _ticket(c.events[2], "ticket imsg") + "</p>",
      "them", who);
    out += stamp("8:47 AM", true);

    /* RSVP poll bubble */
    out += bubble(
      '<p class="pollq">RSVP poll — Oct 21: ' + c.events[0].title + '</p>' +
      '<div class="pollbtns" role="group" aria-label="RSVP poll">' +
        '<button type="button" class="pollbtn" data-vote="in">IN <span class="count" data-in>0</span></button>' +
        '<button type="button" class="pollbtn" data-vote="out">OUT <span class="count" data-out>0</span></button>' +
      "</div>",
      "them poll", who);

    out += stamp("9:15 AM", true);

    /* Diary nights as photo bubbles with star reactions */
    c.diary.forEach(function(d){
      out += bubble(
        '<a class="photobubble" href="' + c.links.letterboxd + '" target="_blank" rel="noopener">' +
          '<img src="' + d.poster + '" alt="' + d.film + ' poster" loading="lazy">' +
          '<span class="pcap">' + d.film + " (" + d.year + ") · " + d.date + "</span></a>" +
        '<p class="pnote2">' + d.note + '</p><p class="reactions" aria-hidden="true"><span class="stars">' + _stars(d.stars) + "</span></p>",
        "them", who);
    });
    out += stamp("Yesterday", true);

    /* Reviews as forwarded Letterboxd links */
    c.reviews.forEach(function(r){
      var stars = (r.stars != null) ? '<span class="stars">' + _stars(r.stars) + "</span><br>" : "";
      out += bubble(
        '<p class="fwd">Forwarded</p>' +
        '<a class="richlink" href="' + r.url + '" target="_blank" rel="noopener">' +
          '<img src="' + r.poster + '" alt="' + r.film + ' poster" loading="lazy">' +
          '<span class="richdomain">letterboxd.com</span>' +
          '<span class="richtitle">' + r.film + " (" + r.year + ")</span></a>" +
        '<p>' + stars + (r.text ? r.text : "") + '<span class="rdate"> ' + r.date + "</span></p>",
        "them", who);
    });
    out += stamp("Today", true);

    /* Press + quotes as late-night texts */
    out += bubble(
      '<p>' + c.press.outlet + ' on us: "' + c.press.quote + '" <a href="' + c.press.url + '" target="_blank" rel="noopener">read it</a></p>',
      "them", who);
    c.quotes.forEach(function(q){
      out += bubble('<p>"' + q.text + '"<br><span class="who">— ' + q.who + "</span></p>", "them", who);
    });

    /* join input bar */
    out +=
      '<div class="chatbar rv">' +
        '<div class="chatinput" role="button" tabindex="0" aria-label="Text JOIN to get the Patreon link">' +
          '<span>Text <strong>JOIN</strong> to get the Patreon link</span>' +
          '<a class="sendbtn" href="' + c.join.patreon + '" target="_blank" rel="noopener" aria-label="Open Patreon">↑</a>' +
        "</div>" +
        '<p class="joinsub">' + c.join.network + " · " + c.join.price + " · " + c.join.pitch + "</p>" +
      "</div>";

    return '<div class="thread" aria-label="Group chat thread">' + out + "</div>";
  },
  mount: function(root){
    /* RSVP poll: local counts */
    var votes = { in: 0, out: 0 };
    var mine = null;
    root.addEventListener("click", function(e){
      var btn = e.target.closest && e.target.closest(".pollbtn");
      if (!btn) return;
      var v = btn.getAttribute("data-vote");
      if (mine === v) {
        votes[v]--; mine = null;
      } else {
        if (mine) votes[mine]--;
        votes[v]++; mine = v;
      }
      var ci = root.querySelector("[data-in]"), co = root.querySelector("[data-out]");
      if (ci) ci.textContent = votes.in;
      if (co) co.textContent = votes.out;
      root.querySelectorAll(".pollbtn").forEach(function(b){
        b.classList.toggle("chosen", b.getAttribute("data-vote") === mine);
      });
    });
    /* tapping the input text opens Patreon */
    root.addEventListener("click", function(e){
      var inp = e.target.closest && e.target.closest(".chatinput");
      if (inp && !e.target.closest("a")) {
        window.open(inp.querySelector(".sendbtn").href, "_blank", "noopener");
      }
    });
  }
};

        '<div class="perkbanner rv" role="note">' +

        "</div>" +
        '<nav class="monthnav rv" aria-label="Month navigation">' +
          '<button type="button" class="chev" data-nav="prev" aria-label="Previous month">‹</button>' +
          "<h2>October 2026</h2>" +
          '<button type="button" class="chev" data-nav="next" aria-label="Next month">›</button>' +
        "</nav>" +
        '<p class="navnote rv" hidden>No screenings listed for that month.</p>' +
        '<div class="dowrow rv" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>' +
        '<div class="grid rv" role="grid" aria-label="October 2026">' + grid + "</div>" +
        '<div class="sheets" aria-live="polite">' + sheet + "</div>" +
        '<section class="lastmonth rv" aria-label="Last month"><h2>Last Month</h2><div class="chips">' + chips + "</div></section>" +
        '<section class="caljoin rv" aria-label="Join"><h2>Join the ' + c.join.network + '</h2>' +
          '<p class="price">' + c.join.price + "</p><p>" + c.join.pitch + "</p>" +
          '<p class="joinactions">' + _ext(c.join.patreon, "Become a member") + " " + _ext(c.join.volunteer, "Volunteer") + "</p></section>" +
        '<footer class="calfoot rv">' +
          '<p class="pressline">"<a href="' + c.press.url + '" target="_blank" rel="noopener">' + c.press.outlet + "</a> says: " + c.press.quote + '"</p>' +
          '<p class="netlinks">' + _ext(c.links.website, "Website") + " · " + _ext(c.links.instagram, "Instagram") + " · " + _ext(c.links.tiktok, "TikTok") + " · " + _ext(c.links.letterboxd, "Letterboxd") + " · " + _ext(c.links.meetup, "Meetup") + "</p>" +
        "</footer>" +

  },
  mount: function(root){

    root.addEventListener("click", function(e){

      if (day) {

/* ===== batch4 ===== */
/* ============================================================
   BATCH 4 — marquee, stubs, booth, boarding
   Four different products: different DOM, IA, and layout logic.
   Concatenated with other batches into the shell; THEMES, MFC,
   and CONTENT are globals provided by the shell. Helpers are
   prefixed b4 to avoid collisions with other batches.
   ============================================================ */

function b4esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
var B4EXT = ' target="_blank" rel="noopener"';
function b4stars(n){ return MFC.stars(n); }
function b4date(e){
  var d = "";
  if (e.day && e.mon) d = e.mon + " " + e.day;
  else d = e.mon || e.day || "";
  if (e.dow) d += " \u00B7 " + e.dow;
  return d;
}
function b4tc(t){
  var m = /(\d{1,2}):(\d{2})\s*([AP])M/i.exec(t || "");
  if (!m) return "--:--:--";
  var h = (+m[1]) % 12;
  if (m[3].toUpperCase() === "P") h += 12;
  return ("0" + h).slice(-2) + ":" + m[2] + ":00";
}
function b4links(c, cls){
  var L = c.links;
  return '<a class="' + cls + '" href="' + b4esc(L.website) + '"' + B4EXT + '>SITE</a>'
    + '<a class="' + cls + '" href="' + b4esc(L.instagram) + '"' + B4EXT + '>INSTAGRAM</a>'
    + '<a class="' + cls + '" href="' + b4esc(L.tiktok) + '"' + B4EXT + '>TIKTOK</a>'
    + '<a class="' + cls + '" href="' + b4esc(L.letterboxd) + '"' + B4EXT + '>LETTERBOXD</a>'
    + '<a class="' + cls + '" href="' + b4esc(L.meetup) + '"' + B4EXT + '>MEETUP</a>'
    + '<a class="' + cls + '" href="' + b4esc(L.linktree) + '"' + B4EXT + '>LINKTREE</a>';
}

   Structure: the letter board IS the navigation. Three tappable

        + '<span class="mq-linetitle">' + b4esc(e.title) + '</span>'
        + '<span class="mq-toggle" aria-hidden="true"></span>'
        + '</button>';

        + (e.note ? '<div class="mq-det-note">' + b4esc(e.note) + '</div>' : '')

    var quotes = c.quotes.map(function(q, i){

        + ' <em>\u2014 ' + b4esc(q.who) + '</em></span>';
    }).join("");
    var snipes = c.diary.map(function(d){
      return '<div class="mq-snipe rv">'

        + '<div class="mq-snipe-t">' + b4esc(d.film) + ' <span>(' + b4esc(d.year) + ')</span></div>'

        + '</div>';
    }).join("");
    var buzz = c.reviews.map(function(r){
      return '<a class="mq-buzz rv" href="' + b4esc(r.url) + '"' + B4EXT + '>'
        + '<img src="' + b4esc(r.poster) + '" alt="' + b4esc(r.film) + ' poster" loading="lazy">'
        + '<span class="mq-buzz-b">'
        + '<span class="mq-buzz-f">' + b4esc(r.film) + ' <i>(' + b4esc(r.year) + ')</i></span>'
        + (r.text ? '<span class="mq-buzz-t">' + b4esc(r.text) + '</span>' : '')
        + '<span class="mq-buzz-m">' + (r.stars != null ? b4stars(r.stars) + ' \u00B7 ' : '') + b4esc(r.date) + '</span>'
        + '</span></a>';
    }).join("");
    return '<div class="mq">'
      + '<header class="mq-top rv">'

      + '<p class="mq-slogan">' + b4esc(c.club.slogan) + '</p>'
      + '</header>'
      + '<section class="mq-sign rv" aria-label="Now showing">'
      + '<div class="mq-frame"><div class="mq-bulbs" aria-hidden="true"></div><div class="mq-board">'
      + '<div class="mq-boardhead"><span>NOW SHOWING</span><span class="mq-hint">TAP A LINE</span></div>'
      + '<div class="mq-lines">' + lines + '</div>'
      + '<div class="mq-details">' + details + '</div>'
      + '</div></div>'
      + '<div class="mq-reader">'
      + '<div class="mq-join"><span>JOIN THE CLUB \u00B7 ' + b4esc(c.join.network)
      + ' \u00B7 ' + b4esc(c.join.price) + '</span>'
      + '<a href="' + b4esc(c.join.patreon) + '"' + B4EXT + '>JOIN</a></div>'
      + '<div class="mq-quotes" aria-live="polite"><span class="mq-qlab">WORD ON THE STREET</span>' + quotes + '</div>'
      + '</div>'
      + '</section>'
      + '<section class="mq-snipesec" aria-label="Past nights">'
      + '<h2 class="mq-sec rv">COMING ATTRACTIONS \u2014 PAST NIGHTS</h2>'
      + '<div class="mq-rail">' + snipes + '</div>'
      + '</section>'
      + '<section class="mq-buzzsec" aria-label="Audience buzz">'
      + '<h2 class="mq-sec rv">AUDIENCE BUZZ</h2>' + buzz
      + '</section>'
      + '<footer class="mq-foot rv">'
      + '<p class="mq-press">' + b4esc(c.press.quote) + ' <a href="' + b4esc(c.press.url) + '"' + B4EXT
      + '>\u2014 ' + b4esc(c.press.outlet) + '</a></p>'
      + '<p class="mq-stats">' + b4esc(c.stats.members) + ' MEMBERS \u00B7 ' + b4esc(c.stats.posts)
      + ' POSTS \u00B7 ' + b4esc(c.stats.upcoming) + ' UPCOMING</p>'
      + '<nav class="mq-links" aria-label="Find the club">' + b4links(c, 'mq-link') + '</nav>'
      + '<p class="mq-blurb">' + b4esc(c.club.blurb) + '</p>'
      + '</footer>'
      + '</div>';
  },
  mount: function(root){
    var sign = root.querySelector(".mq-sign");
    if (sign) {
      root.addEventListener("click", function(ev){
        var line = ev.target.closest(".mq-line");
        if (!line || !sign.contains(line)) return;
        var id = line.getAttribute("data-att");
        var wasOpen = line.classList.contains("open");
        var lines = sign.querySelectorAll(".mq-line");
        var details = sign.querySelectorAll(".mq-detail");
        for (var i = 0; i < lines.length; i++) {
          lines[i].classList.remove("open");
          lines[i].setAttribute("aria-expanded", "false");
        }
        for (var j = 0; j < details.length; j++) {
          var show = details[j].getAttribute("data-det") === id && !wasOpen;
          details[j].classList.toggle("show", show);
        }
        if (!wasOpen) {
          line.classList.add("open");
          line.setAttribute("aria-expanded", "true");
        }
      });
    }
    /* rotating reader-board quotes (frozen when reduced motion) */
    var qs = Array.prototype.slice.call(root.querySelectorAll(".mq-quote"));
    if (qs.length > 1 && window.matchMedia && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      var qi = 0;
      setInterval(function(){
        qs[qi].classList.remove("on");
        qi = (qi + 1) % qs.length;
        qs[qi].classList.add("on");
      }, 6000);
    }
  }
};

/* ============================================================
   2) STUBS — ticket-stub scrapbook.
   Structure: everything is a physical stub in one chronological
   stack. Upcoming events are full-color stubs whose tear-off end
   IS the ticket button. Past nights are faded KEPT stubs; reviews
   are stubs you flip to read the note scribbled on the back. Join
   is a gold SEASON PASS stub. Fan-in motion, 3D flip on tap.
   ============================================================ */
THEMES.stubs = {
  label: "Ticket Stubs",
  meta: "#efe6d8",
  render: function(c){
    var tilts = ["-2deg", "1.6deg", "-1.2deg", "2deg"];
    var evstubs = c.events.map(function(e, i){
      var no = ("0" + (i + 1)).slice(-2);
      var rows = '<div class="st-row"><span>DATE</span><b>' + b4esc(b4date(e)) + '</b></div>';
      if (e.time) rows += '<div class="st-row"><span>TIME</span><b>' + b4esc(e.time) + '</b></div>';
      if (e.venue) rows += '<div class="st-row"><span>VENUE</span><b>' + b4esc(e.venue) + '</b></div>';
      if (e.note) rows += '<div class="st-row"><span>NOTE</span><b>' + b4esc(e.note) + '</b></div>';
      return '<article class="st-stub st-ev' + (i + 1) + ' rv" style="--tilt:' + tilts[i % 4] + '">'
        + '<div class="st-body">'
        + '<div class="st-topline"><span class="st-tag">' + b4esc(e.tag) + '</span>'
        + '<span class="st-no">NO. ' + no + '</span></div>'
        + '<h3 class="st-title">' + b4esc(e.title) + '</h3>'
        + rows
        + '</div>'
        + '<a class="st-tear" href="' + b4esc(e.ticketUrl) + '"' + B4EXT
        + ' aria-label="' + b4esc(e.ticketLabel) + ': ' + b4esc(e.title) + '">'
        + '<span class="st-admit">ADMIT ONE</span>'
        + '<span class="st-barcode" aria-hidden="true"></span>'
        + '<span class="st-tearlabel">' + b4esc(e.ticketLabel) + '</span>'
        + '</a></article>';
    }).join("");
    var kept = c.diary.map(function(d, i){
      return '<button class="st-flip rv" data-flip style="--tilt:' + tilts[(i + 1) % 4] + '"'
        + ' aria-expanded="false" aria-label="Flip stub: ' + b4esc(d.film) + '">'
        + '<span class="st-flipinner">'
        + '<span class="st-face st-front st-kept">'
        + '<img src="' + b4esc(d.poster) + '" alt="' + b4esc(d.film) + ' poster" loading="lazy">'
        + '<span class="st-finfo"><b>' + b4esc(d.film) + ' <i>(' + b4esc(d.year) + ')</i></b>'
        + '<span class="st-fstars">' + b4stars(d.stars) + '</span>'
        + '<span class="st-fdate">' + b4esc(d.date) + '</span>'
        + '<span class="st-hint">TAP TO FLIP</span></span>'
        + '</span>'
        + '<span class="st-face st-back"><span class="st-backnote">' + b4esc(d.note) + '</span>'
        + '<span class="st-backmeta">KEPT \u00B7 ' + b4esc(d.date) + '</span></span>'
        + '</span></button>';
    }).join("");
    var notes = c.reviews.map(function(r, i){
      var back = r.text
        ? '<span class="st-backnote">' + b4esc(r.text) + '</span>'
        : '<span class="st-backnote">Logged ' + b4esc(r.date) + ' \u2014 no note scribbled, just the rating.</span>';
      return '<button class="st-flip rv" data-flip style="--tilt:' + tilts[(i + 2) % 4] + '"'
        + ' aria-expanded="false" aria-label="Flip stub: ' + b4esc(r.film) + '">'
        + '<span class="st-flipinner">'
        + '<span class="st-face st-front">'
        + '<img src="' + b4esc(r.poster) + '" alt="' + b4esc(r.film) + ' poster" loading="lazy">'
        + '<span class="st-finfo"><b>' + b4esc(r.film) + ' <i>(' + b4esc(r.year) + ')</i></b>'
        + (r.stars != null ? '<span class="st-fstars">' + b4stars(r.stars) + '</span>' : '')
        + '<span class="st-fdate">' + b4esc(r.date) + '</span>'
        + '<span class="st-hint">TAP TO READ THE BACK</span></span>'
        + '</span>'
        + '<span class="st-face st-back">' + back
        + '<a class="st-backlink" href="' + b4esc(r.url) + '"' + B4EXT + '>LETTERBOXD \u2192</a></span>'
        + '</span></button>';
    }).join("");
    var quotes = c.quotes.map(function(q, i){
      return '<figure class="st-note rv" style="--tilt:' + tilts[i % 4] + '">'
        + '<blockquote>' + b4esc(q.text) + '</blockquote>'
        + '<figcaption>\u2014 ' + b4esc(q.who) + '</figcaption></figure>';
    }).join("");
    var pass = '<article class="st-pass rv" style="--tilt:1deg">'
      + '<div class="st-body">'
      + '<div class="st-topline"><span class="st-tag">SEASON PASS</span><span class="st-no">NO. 00</span></div>'
      + '<h3 class="st-title">' + b4esc(c.join.network) + '</h3>'
      + '<p class="st-pitch">' + b4esc(c.join.pitch) + '</p>'
      + '<div class="st-row"><span>DUES</span><b>' + b4esc(c.join.price) + '</b></div>'
      + '<a class="st-vol" href="' + b4esc(c.join.volunteer) + '"' + B4EXT + '>VOLUNTEER \u2192</a>'
      + '</div>'
      + '<a class="st-tear" href="' + b4esc(c.join.patreon) + '"' + B4EXT + ' aria-label="Join on Patreon">'
      + '<span class="st-admit">ADMIT ONE</span>'
      + '<span class="st-barcode" aria-hidden="true"></span>'
      + '<span class="st-tearlabel">JOIN</span>'
      + '</a></article>';
    return '<div class="st">'
      + '<header class="st-mast rv">'
      + '<div class="st-kicker">' + b4esc(c.club.tagline) + '</div>'
      + '<h1>' + b4esc(c.club.name) + '</h1>'
      + '<p class="st-slogan">' + b4esc(c.club.slogan) + '</p>'
      + '<p class="st-stats">' + b4esc(c.stats.members) + ' MEMBERS \u00B7 ' + b4esc(c.stats.posts)
      + ' POSTS \u00B7 ' + b4esc(c.stats.upcoming) + ' UPCOMING</p>'
      + '</header>'
      + '<h2 class="st-sec rv">UPCOMING \u2014 TEAR &amp; GO</h2>' + evstubs
      + '<h2 class="st-sec rv">KEPT \u2014 PAST NIGHTS</h2>' + kept
      + '<h2 class="st-sec rv">NOTES ON THE BACK \u2014 MEMBER REVIEWS</h2>' + notes
      + '<h2 class="st-sec rv">PINNED TO THE BOARD</h2>' + quotes
      + '<h2 class="st-sec rv">SEASON PASS</h2>' + pass
      + '<footer class="st-foot rv">'
      + '<p class="st-press">' + b4esc(c.press.quote) + ' <a href="' + b4esc(c.press.url) + '"' + B4EXT
      + '>\u2014 ' + b4esc(c.press.outlet) + '</a></p>'
      + '<nav class="st-links" aria-label="Find the club">' + b4links(c, 'st-link') + '</nav>'
      + '<p class="st-blurb">' + b4esc(c.club.blurb) + '</p>'
      + '</footer>'
      + '</div>';
  },
  mount: function(root){
    root.addEventListener("click", function(ev){
      if (ev.target.closest("a")) return;
      var f = ev.target.closest("[data-flip]");
      if (!f) return;
      var on = f.classList.toggle("flipped");
      f.setAttribute("aria-expanded", on ? "true" : "false");
    });
  }
};

/* ============================================================
   3) BOOTH — projectionist's cue sheet.
   Structure: backstage terminal. Events are timecoded CUE rows
   (auto-numbered); the glowing CUE button IS the ticket action —
   pressing flashes "CUE FIRED" then opens the link. Past nights
   are CSS-counter-numbered LOGGED REELS, reviews are marginalia,
   and a running timecode ticks in the header (frozen on reduced
   motion). No cards, no images-as-hero — pure cue sheet.
   ============================================================ */
THEMES.booth = {
  label: "Booth",
  meta: "#0b0e11",
  render: function(c){
    var cues = c.events.map(function(e){
      var sub = [b4date(e)];
      if (e.time) sub.push(e.time);
      if (e.venue) sub.push(e.venue);
      if (e.note) sub.push(e.note);
      sub.push("TAG:" + e.tag);
      return '<div class="bo-cue rv">'
        + '<div class="bo-cuehead"><span class="bo-tc">[TC ' + b4tc(e.time) + ']</span>'
        + '<span class="bo-cuelab">CUE</span>'
        + '<h3>' + b4esc(e.title) + '</h3></div>'
        + '<div class="bo-cuesub">&gt; ' + b4esc(sub.join(" \u00B7 ")) + '</div>'
        + '<button class="bo-cuebtn" data-url="' + b4esc(e.ticketUrl) + '">CUE \u2014 '
        + b4esc(e.ticketLabel) + '</button>'
        + '<div class="bo-fired" aria-live="polite">CUE FIRED \u2014 SEE YOU THERE</div>'
        + '</div>';
    }).join("");
    var reels = c.diary.map(function(d){
      return '<div class="bo-reel rv">'
        + '<img src="' + b4esc(d.poster) + '" alt="' + b4esc(d.film) + ' poster" loading="lazy">'
        + '<div class="bo-reelb"><div class="bo-reelt">' + b4esc(d.film)
        + ' <span>(' + b4esc(d.year) + ')</span></div>'
        + '<div class="bo-reelm">' + b4stars(d.stars) + ' \u00B7 ' + b4esc(d.date) + '</div>'
        + '<div class="bo-reeln">' + b4esc(d.note) + '</div></div></div>';
    }).join("");
    var notes = c.reviews.map(function(r){
      return '<div class="bo-note rv">'
        + '<div class="bo-notehead">NOTE // ' + b4esc(r.film) + ' (' + b4esc(r.year) + ')'
        + (r.stars != null ? ' \u2014 ' + b4stars(r.stars) : '') + '</div>'
        + (r.text ? '<p>' + b4esc(r.text) + '</p>'
          : '<p class="bo-nonote">[NO MARGINALIA \u2014 LOGGED ' + b4esc(r.date) + ']</p>')
        + '<a href="' + b4esc(r.url) + '"' + B4EXT + '>[ OPEN ON LETTERBOXD ]</a></div>';
    }).join("");
    var oplog = c.quotes.map(function(q){
      return '<div class="bo-op rv"><p>' + b4esc(q.text) + '</p><div>\u2014 ' + b4esc(q.who) + '</div></div>';
    }).join("");
    return '<div class="bo">'
      + '<header class="bo-head rv">'
      + '<div class="bo-sys">MFC // PROJECTION BOOTH \u2014 ' + b4esc(c.club.tagline) + '</div>'
      + '<div class="bo-clock" data-tc>TC 00:00:00:00</div>'
      + '<div class="bo-stats">SEATS ' + b4esc(c.stats.members) + ' \u00B7 LOG ' + b4esc(c.stats.posts)
      + ' \u00B7 QUEUED ' + b4esc(c.stats.upcoming) + '</div>'
      + '</header>'
      + '<h2 class="bo-sect rv">CUE SHEET \u2014 UPCOMING</h2>'
      + '<div class="bo-cues">' + cues + '</div>'
      + '<h2 class="bo-sect rv">LOGGED REELS \u2014 PAST PROJECTIONS</h2>'
      + '<div class="bo-reels">' + reels + '</div>'
      + '<h2 class="bo-sect rv">PROJECTION NOTES \u2014 MARGINALIA</h2>' + notes
      + '<section class="bo-join rv" aria-label="Join">'
      + '<h2>SUBROUTINE: JOIN_NETWORK</h2>'
      + '<p>' + b4esc(c.join.pitch) + '</p>'
      + '<div class="bo-joinm">NETWORK: ' + b4esc(c.join.network) + ' \u00B7 DUES: ' + b4esc(c.join.price) + '</div>'
      + '<a class="bo-exec" href="' + b4esc(c.join.patreon) + '"' + B4EXT + '>[ EXECUTE: PATREON ]</a> '
      + '<a class="bo-exec" href="' + b4esc(c.join.volunteer) + '"' + B4EXT + '>[ EXECUTE: VOLUNTEER ]</a>'
      + '</section>'
      + '<h2 class="bo-sect rv">OPERATOR LOG \u2014 MEMBER TRANSMISSIONS</h2>' + oplog
      + '<footer class="bo-foot rv">'
      + '<p class="bo-press">INCOMING TRANSMISSION \u2014 ' + b4esc(c.press.outlet) + ': '
      + b4esc(c.press.quote) + ' <a href="' + b4esc(c.press.url) + '"' + B4EXT + '>[ READ ]</a></p>'
      + '<nav class="bo-links" aria-label="Find the club">' + b4links(c, 'bo-link') + '</nav>'
      + '<p class="bo-blurb">' + b4esc(c.club.blurb) + ' // ' + b4esc(c.club.slogan) + '</p>'
      + '</footer>'
      + '</div>';
  },
  mount: function(root){
    var tcEl = root.querySelector("[data-tc]");
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (tcEl && !reduced) {
      var t0 = Date.now();
      var pad = function(n){ return ("0" + n).slice(-2); };
      setInterval(function(){
        var el = Date.now() - t0;
        var s = Math.floor(el / 1000);
        var fr = Math.floor((el % 1000) / 1000 * 12);
        tcEl.textContent = "TC " + pad(Math.floor(s / 3600) % 24) + ":" + pad(Math.floor(s / 60) % 60)
          + ":" + pad(s % 60) + ":" + pad(fr);
      }, 83);
    }
    root.addEventListener("click", function(ev){
      var b = ev.target.closest(".bo-cuebtn");
      if (!b) return;
      var row = b.closest(".bo-cue");
      if (!row || row.classList.contains("fired")) return;
      row.classList.add("fired");
      try { window.open(b.getAttribute("data-url"), "_blank", "noopener"); } catch (e) {}
      setTimeout(function(){ row.classList.remove("fired"); }, 1600);
    });
  }
};

      + '<footer class="bd-foot rv">'
      + '<p class="bd-press">CLEARED FOR TAKEOFF \u2014 ' + b4esc(c.press.outlet) + ': '
      + b4esc(c.press.quote) + ' <a href="' + b4esc(c.press.url) + '"' + B4EXT + '>READ \u2192</a></p>'
      + '<p class="bd-stats">' + b4esc(c.stats.members) + ' MEMBERS \u00B7 ' + b4esc(c.stats.posts)
      + ' POSTS \u00B7 ' + b4esc(c.stats.upcoming) + ' UPCOMING</p>'
      + '<nav class="bd-links" aria-label="Find the club">' + b4links(c, 'bd-link') + '</nav>'
      + '<p class="bd-blurb">' + b4esc(c.club.blurb) + '</p>'
      + '</footer>'
      + '</div>';
  }
};


/* ============ router ============ */
var stage = document.getElementById("stage");
var tabsEl = document.getElementById("tabs");
THEME_ORDER.forEach(function(key){
  var b = document.createElement("button");
  b.className = "tab"; b.dataset.theme = key;
  b.textContent = (THEMES[key] && THEMES[key].label) || key;
  b.addEventListener("click", function(){ setTheme(key); });
  tabsEl.appendChild(b);
});
function setTheme(key, save){
  if (!THEMES[key]) key = THEME_ORDER[0];
  document.body.setAttribute("data-theme", key);
  document.body.className = "";
  stage.innerHTML = THEMES[key].render(CONTENT);
  if (THEMES[key].mount) { try { THEMES[key].mount(stage); } catch(e){} }
  var tabs = tabsEl.querySelectorAll(".tab");
  tabs.forEach(function(b){ b.classList.toggle("active", b.dataset.theme === key); });
  var m = document.getElementById("tcolor");
  if (m && THEMES[key].meta) m.setAttribute("content", THEMES[key].meta);
  if (save !== false) { try { localStorage.setItem("mfc-theme", key); } catch(e){} }
  window.scrollTo(0, 0);
  requestAnimationFrame(revealScan);
}
/* scroll reveals */
var revealIO = null;
function revealScan(){
  var els = stage.querySelectorAll(".rv:not(.in)");
  if (!("IntersectionObserver" in window)) { els.forEach(function(el){ el.classList.add("in"); }); return; }
  if (!revealIO) {
    revealIO = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) { en.target.classList.add("in"); revealIO.unobserve(en.target); }
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -4% 0px" });
  }
  els.forEach(function(el){ revealIO.observe(el); });
}
(function init(){
  var key = THEME_ORDER[0];
  try {
    var saved = localStorage.getItem("mfc-theme");
    if (saved && THEMES[saved]) key = saved;
  } catch(e){}
  setTheme(key, false);
})();
</script>
<noscript><style>.rv{opacity:1!important;transform:none!important}</style></noscript>
